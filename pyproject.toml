[project]
name = "my-fast-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = ["apps/userservice", "packages/utils"]

[tool.uv]
publish-url = "https://packages.aliyun.com/6a34d461d8362ae2652485c2/pypi/repo-fhghq"

[[tool.uv.index]]
name = "aliyun"
url = "https://packages.aliyun.com/6a34d461d8362ae2652485c2/pypi/repo-fhghq"
priority = "primary"

[[tool.uv.index]]
name = "mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "default"

[tool.pytest.ini_options]
testpaths = ["apps/userservice/test"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
]
